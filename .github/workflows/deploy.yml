# Deploys the SvelteKit static build to Cloudflare Workers (static assets) on every push.
name: deploy
on:
  push:
    branches: [master, main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_LB_URL: https://pulsestack-lb.lotusquants.workers.dev
          PUBLIC_APP_VERSION: ${{ github.sha }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
