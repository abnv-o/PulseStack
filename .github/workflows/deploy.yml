# Auto-deploy Cloudflare Pages (game) + Worker (leaderboard) on push to main/master.
# Requires repo secrets — see README "Deploy (Cloudflare)".
name: deploy

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      pages:
        description: Deploy Cloudflare Pages (game UI)
        type: boolean
        default: true
      worker:
        description: Deploy Worker (leaderboard API)
        type: boolean
        default: true

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Cloudflare Pages
    if: github.event_name == 'push' || inputs.pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Set repo variable PUBLIC_LB_URL to your Worker URL (e.g. https://pulsestack-lb.<account>.workers.dev)
          PUBLIC_LB_URL: ${{ vars.PUBLIC_LB_URL }}
          PUBLIC_APP_VERSION: ${{ github.sha }}

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CF_PAGES_PROJECT || 'pulsestack' }} --commit-dirty=true

  worker:
    name: Cloudflare Worker
    if: github.event_name == 'push' || inputs.worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        working-directory: .
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
