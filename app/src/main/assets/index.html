<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pulse Stack</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0F1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
  :root{--ground:#0B0F1A;--ground-2:#121829;--ink:#F3EEE4;--dim:#8C93A8;--pulse:#F2A65A;--hot:#FFD27A;--cool:#6FAFC6;--line:rgba(243,238,228,.10);
    --ease-out:cubic-bezier(0.23,1,0.32,1)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--ground);color:var(--ink);font-family:ui-monospace,"Roboto Mono",Menlo,monospace;
    overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
  #stage{position:fixed;inset:0}
  #c{display:block;width:100%;height:100%}
  .hud{position:absolute;top:calc(env(safe-area-inset-top) + 14px);left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
  .hud .n{font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .hud small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:4px}
  .hud .best{text-align:right;font-size:18px;font-weight:600;color:var(--dim)}
  .hud .streak{color:var(--pulse);letter-spacing:.08em;min-height:1em}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:28px;padding-block:calc(env(safe-area-inset-top) + 28px) calc(env(safe-area-inset-bottom) + 28px);gap:14px;
    background:linear-gradient(180deg,rgba(11,15,26,.55),rgba(11,15,26,.92))}
  .overlay[hidden]{display:none}
  #over:not([hidden]),#options:not([hidden]),#lb:not([hidden]),#menu:not([hidden]){
    animation:sheetIn 200ms var(--ease-out) both}
  @keyframes sheetIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    #over:not([hidden]),#options:not([hidden]),#lb:not([hidden]),#menu:not([hidden]){animation:sheetFade 160ms var(--ease-out) both}
    @keyframes sheetFade{from{opacity:0}to{opacity:1}}
  }
  #start{justify-content:space-between;gap:0;padding-inline:24px}
  #start .homeTop,#start .homeMid{display:flex;flex-direction:column;align-items:center;width:100%;max-width:320px}
  #start .homeTop{gap:12px;padding-top:12px}
  #start .homeMid{gap:16px;flex:1;justify-content:center}
  h1{font-family:system-ui,sans-serif;font-weight:800;font-size:clamp(36px,11vw,48px);margin:0;letter-spacing:-.03em;line-height:1}
  h1 span{color:var(--pulse)}
  h2{font-family:system-ui,sans-serif;font-weight:800;font-size:32px;margin:0;letter-spacing:-.03em;line-height:1.05}
  .overlay p{margin:0;max-width:30ch;color:var(--dim);font-size:13px;line-height:1.55}
  #start .tag{max-width:22ch;font-size:14px;line-height:1.45}
  .big{font-size:72px;color:var(--pulse);font-variant-numeric:tabular-nums;font-weight:600;line-height:1}
  .verdict{color:var(--ink)!important}
  .board{font-size:12px!important;letter-spacing:.04em}
  .delta{color:var(--hot)!important;font-size:14px!important;font-weight:600}
  .stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:320px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .stats b{display:block;color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;margin-top:4px}
  .unlockNote{color:var(--pulse)!important;font-size:13px!important;font-weight:600;min-height:1.2em}
  #over{gap:12px}
  #over #again{width:100%;max-width:320px;min-height:52px;margin-top:4px}
  #over .overBar{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:320px}
  #over .overBar button{margin:0;padding:12px 10px;min-height:44px;background:transparent;color:var(--dim);border:0;border-radius:0;letter-spacing:.1em;
    transition:color 160ms var(--ease-out)}
  #over .overBar button:active{transform:none;color:var(--ink)}
  button{font:inherit;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;color:var(--ground);
    background:var(--pulse);border:0;border-radius:999px;padding:16px 32px;margin-top:8px;
    transition:transform 160ms var(--ease-out)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);margin-top:0}
  button:active{transform:scale(.97)}
  #go{width:100%;max-width:320px;min-height:52px;margin-top:0}
    #pulsePrev{width:112px;height:112px;display:block;touch-action:manipulation;cursor:pointer}
  .homeBar{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:320px;padding-top:20px}
  .homeBar button{margin:0;padding:12px 8px;min-height:44px;background:transparent;color:var(--dim);border:0;border-radius:0;letter-spacing:.1em;
    transition:color 160ms var(--ease-out)}
  .homeBar button:active{transform:none;color:var(--ink)}
  .dayStreak{font-size:12px;color:var(--dim);letter-spacing:.06em;min-height:1em}
  .coach{position:absolute;left:0;right:0;top:42%;text-align:center;pointer-events:none;font-family:system-ui,sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em;color:var(--hot);text-shadow:0 1px 12px rgba(11,15,26,.8)}
  .coach[hidden]{display:none}
  .vers{font-size:10px;color:var(--dim);letter-spacing:.1em;padding:12px 8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  #share{display:none}
  #share.on{display:inline-block}
  /* options */
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px}
  .opt{display:flex;flex-direction:column;gap:6px;align-items:center;padding:10px 6px 8px;border-radius:14px;border:1px solid var(--line);background:var(--ground-2);color:var(--dim);font-size:11px}
  .opt canvas{width:100%;aspect-ratio:1;border-radius:8px}
  .opt.on{border-color:var(--pulse);color:var(--ink)}
  .opt.locked{opacity:.42}
  .opt.locked span{font-size:9px;letter-spacing:.04em}
  .toggle{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
  .toggle b{color:var(--ink)}
  .hud button{pointer-events:auto;margin:0;padding:8px 14px;font-size:14px;background:transparent;color:var(--dim);border:1px solid var(--line);
    transition:color 160ms var(--ease-out)}
  input{font:inherit;font-size:16px;color:var(--ink);background:var(--ground-2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:center;width:100%;max-width:320px;outline:0}
  input:focus{border-color:var(--pulse)}
  ol{margin:0;padding:0;list-style:none;width:100%;max-width:300px;font-size:14px}
  ol li{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)}
  ol li.me{color:var(--pulse)}
  ol li b{font-variant-numeric:tabular-nums}
  ol li small{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hud"><div><div class="n" id="score">0</div><small>height</small><small class="streak" id="streak"></small></div><div style="display:flex;gap:12px;align-items:flex-start"><div><div class="best" id="best">0</div><small>best</small></div><button id="menuBtn" aria-label="Menu">&#9776;</button></div></div>
  <div class="coach" id="coach" hidden>Tap at the peak</div>

  <div class="overlay" id="start">
    <div class="homeTop">
      <h1>Pulse<span>Stack</span></h1>
      <p class="tag">Tap the peak. The tower only gets thinner.</p>
      <div class="dayStreak" id="dayStreak"></div>
    </div>
    <div class="homeMid">
      <canvas id="pulsePrev" width="112" height="112" aria-label="Pulse preview"></canvas>
      <input id="name" placeholder="your name" maxlength="12" autocomplete="off">
      <button id="go">Start</button>
    </div>
    <div class="homeBar">
      <button type="button" id="lbBtn">Board</button>
      <button type="button" id="optBtn">Pulse</button>
      <div class="vers" id="vers"></div>
    </div>
  </div>

  <div class="overlay" id="options" hidden>
    <h2>The pulse</h2>
    <p>Six ways to see the same beat. Tap one to pick it; all of them are live.</p>
    <div class="opts" id="opts"></div>
    <label class="toggle"><input type="checkbox" id="snd"> <span>Sound <b id="sndV"></b></span></label>
    <button id="optDone">Done</button>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="big" id="final">0</div>
    <h2 id="headline">The tower is a thread.</h2>
    <p class="delta" id="delta"></p>
    <div class="stats" id="stats"></div>
    <p class="unlockNote" id="unlockNote"></p>
    <p class="board" id="board"></p>
    <button id="again">Again</button>
    <div class="overBar">
      <button type="button" id="share">Share</button>
      <button type="button" id="lbBtn2">Board</button>
      <button type="button" id="optBtn2">Pulse</button>
    </div>
  </div>

  <div class="overlay" id="lb" hidden>
    <h2 id="lbTitle">Leaderboard</h2>
    <ol id="lbList"></ol>
    <div class="row"><button class="ghost" id="lbMode">Today</button><button id="lbDone">Back</button></div>
  </div>

  <div class="overlay" id="menu" hidden>
    <h2>Paused</h2>
    <button id="resume">Resume</button>
    <div class="row"><button class="ghost" id="restart">Restart</button><button class="ghost" id="optBtn3">Pulse</button><button class="ghost" id="quit">Quit</button></div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d'), stage = $('stage');
  let W = 0, H = 0;
  const BH = 16, REST = 1200, MIN_PERIOD = 430;
  // Captured at load so a devtools `Math.random = () => 0.5` can't make the beat predictable.
  const rnd = (u => () => (crypto.getRandomValues(u), u[0] / 4294967296))(new Uint32Array(1));
  // Once /start answers, the rhythm comes from the server's seed so it can replay the run (mirrored in worker.js).
  const mulberry32 = a => () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let rng = rnd, taps = [], beat0 = 0;
  const INK = 'rgba(243,238,228,', P = '#F2A65A', HOT = '#FFD27A', COOL = 'rgba(111,175,198,.55)';
  const SHAPES = [
    { id:'circle',  name:'Circle' }, { id:'ghost', name:'Ghost block' }, { id:'shutter', name:'Shutters' },
    { id:'pendulum',name:'Pendulum' }, { id:'meter', name:'Meter' }, { id:'sonar', name:'Sonar' },
  ];
  const FREE_SKINS = new Set(['circle', 'ghost', 'meter']);
  const TIER_NAME = ['', 'WARM', 'HOT', 'FEVER', 'OVERDRIVE'];
  const tierOf = s => s >= 20 ? 4 : s >= 10 ? 3 : s >= 5 ? 2 : s >= 3 ? 1 : 0;
  const pref = (k, d) => { try { const v = localStorage.getItem('ps-' + k); return v === null ? d : v; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem('ps-' + k, v); } catch {} };
  function loadUnlocks() {
    try {
      const u = JSON.parse(pref('unlocks', '{"skins":[]}'));
      return { skins: new Set(Array.isArray(u.skins) ? u.skins : []) };
    } catch { return { skins: new Set() }; }
  }
  function saveUnlocks() { save('unlocks', JSON.stringify({ skins: [...unlocks.skins] })); }
  const unlocks = loadUnlocks();
  const isUnlocked = id => FREE_SKINS.has(id) || unlocks.skins.has(id);
  function unlockSkin(id) {
    if (FREE_SKINS.has(id) || unlocks.skins.has(id)) return null;
    unlocks.skins.add(id); saveUnlocks();
    const s = SHAPES.find(x => x.id === id); return s ? s.name : id;
  }
  // New installs default to Meter; anyone who already has an id keeps prior default (ghost) if unset.
  const returning = !!pref('id', '');
  let shape = pref('shape', returning ? 'ghost' : 'meter'), sound = pref('sound', '1') === '1', best = +pref('best', 0);
  // Quietly grant unlocks already earned by existing best (returning players).
  if (best >= 15) unlockSkin('sonar');
  if (best >= 30) unlockSkin('shutter');
  if (best >= 50) unlockSkin('pendulum');
  if (!isUnlocked(shape)) { shape = 'meter'; save('shape', shape); }
  let taught = pref('taught', '') === '1', teaching = false, lastScore = 0, lastPerfectPct = 0, lastMaxStreak = 0, lastTier = 0;
  let bestTower = (() => { try { const a = JSON.parse(pref('bestTower', '[]')); return Array.isArray(a) ? a.map(Number).filter(n => n > 0) : []; } catch { return []; } })();
  // bestTower stores width as fraction of canvas W (stable across resize / relaunch).
  $('best').textContent = best;
  $('name').value = pref('name', '');
  $('name').addEventListener('input', e => save('name', e.target.value.trim()));
  const who = () => $('name').value.trim() || 'Player';
  const utcDay = () => new Date().toISOString().slice(0, 10);
  function syncDayStreakHud() {
    const s = +pref('dayStreak', '0');
    $('dayStreak').textContent = s > 1 ? s + ' day streak' : s === 1 ? '1 day streak' : '';
  }
  function bumpDayStreak() {
    const today = utcDay(), last = pref('lastDay', '');
    let s = +pref('dayStreak', '0');
    if (last === today) { /* already counted */ }
    else if (last) {
      const prev = new Date(last + 'T00:00:00Z'), cur = new Date(today + 'T00:00:00Z');
      const gap = Math.round((cur - prev) / 864e5);
      s = gap === 1 ? s + 1 : 1;
    } else s = 1;
    save('lastDay', today); save('dayStreak', String(s)); syncDayStreakHud();
  }
  syncDayStreakHud();
  // Shared board on a Cloudflare Worker (see worker/); the local copy is the offline fallback.
  const LB_URL = 'https://pulsestack-lb.lotusquants.workers.dev';
  const pid = pref('id', '') || (v => (save('id', v), v))(crypto.randomUUID ? crypto.randomUUID() : [...Array(32)].map(() => (Math.random() * 16 | 0).toString(16)).join(''));
  const post = (path, body) => fetch(LB_URL + path, { method: 'POST', body: JSON.stringify({ pid, ...body }) }).then(r => r.json());
  let tok = null;
  const lbKey = mode => mode === 'daily' ? 'lbDaily' : 'lb';
  const lbGet = (mode = 'endless') => { try { const l = JSON.parse(pref(lbKey(mode), '[]')); return Array.isArray(l) ? l : []; } catch { return []; } };
  const lbRank = (l, n) => l.findIndex(e => e.id === pid.slice(0, 4) && e.n === n) + 1;
  function lbAdd(name, n) {
    // one run lands on both boards; local copies are the offline view
    const tops = ['endless', 'daily'].map(mode => {
      const l = lbGet(mode).filter(e => e.id !== pid.slice(0, 4) || e.n >= n);
      if (!l.some(e => e.id === pid.slice(0, 4))) l.push({ id: pid.slice(0, 4), name, n });
      l.sort((a, b) => b.n - a.n); const top = l.slice(0, 10); save(lbKey(mode), JSON.stringify(top)); return top;
    });
    const t = tok; tok = null;
    if (!t) { $('board').textContent = 'Offline · local only'; }
    else {
      $('board').textContent = 'Submitting…';
      post('/score', { tok: t, name, n, taps }).then(j => {
        if (!Array.isArray(j.lifetime)) { $('board').textContent = j.error ? 'Not counted · ' + j.error : "Couldn't reach the board"; return; }
        save('lb', JSON.stringify(j.lifetime)); save('lbDaily', JSON.stringify(j.daily));
        const r = lbRank(j.lifetime, n), d = lbRank(j.daily, n);
        $('board').textContent = 'Submitted' + (r ? ` · #${r} all-time` : '') + (d ? ` · #${d} today` : '') + (r || d ? '' : ' · outside top 10');
      }).catch(() => { $('board').textContent = "Couldn't reach the board"; });
    }
    return lbRank(tops[0], n);
  }
  let lbView = 'endless';
  function lbRender(l) { $('lbList').innerHTML = l.length ? l.map((e, i) => `<li${e.id === pid.slice(0, 4) ? ' class="me"' : ''}><span>${i + 1}. ${e.name.replace(/[<>&]/g, '')} <small>#${e.id}</small></span><b>${e.n}</b></li>`).join('') : '<li><span>No runs yet</span></li>'; }
  function showLb(back, mode = lbView) {
    lbView = mode === 'daily' ? 'daily' : 'endless';
    $('start').hidden = $('over').hidden = $('menu').hidden = true; $('lb').hidden = false; lbBack = back;
    $('lbTitle').textContent = lbView === 'daily' ? 'Today' : 'All-time';
    $('lbMode').textContent = lbView === 'daily' ? 'All-time' : 'Today';
    lbRender(lbGet(lbView));
    const url = lbView === 'daily' ? LB_URL + '/daily' : LB_URL;
    fetch(url).then(r => r.json()).then(l => { if (Array.isArray(l)) { save(lbKey(lbView), JSON.stringify(l)); lbRender(l); } }).catch(() => {});
  }
  let lbBack = 'start', paused = false, lastNow = 0;
  $('vers').textContent = window.Android ? ('v' + Android.version()) : 'web';

  // ---------- audio ----------
  let ac = null;
  function audio() { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
  function noiseBurst(a, dur, lpHz, gain, t) {
    const buf = a.createBuffer(1, Math.max(1, a.sampleRate * dur | 0), a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = a.createBufferSource(), lp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; lp.type = 'lowpass'; lp.frequency.value = lpHz;
    src.connect(lp).connect(g).connect(a.destination);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    src.start(t); src.stop(t + dur);
  }
  function hihat(a, t, gain) {
    const buf = a.createBuffer(1, a.sampleRate * .04 | 0, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = a.createBufferSource(), hp = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; hp.type = 'highpass'; hp.frequency.value = 6000;
    src.connect(hp).connect(g).connect(a.destination);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + .04);
    src.start(t); src.stop(t + .04);
  }
  function playKick(a, t, gain) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(48, t + .12);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(.001, t + .14);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + .14);
    noiseBurst(a, .06, 220, gain * .45, t);
  }
  function tone(kind, n) {
    if (!sound) return;
    const a = audio(), t = a.currentTime, g = a.createGain(); g.connect(a.destination);
    if (kind === 'bad') {
      noiseBurst(a, .18, 160, .5, t); return;
    }
    const bias = kind === 'perfect' ? 1 + feverTier * .04 : 1;
    const o = a.createOscillator(), f = 330 * Math.pow(2, n / 24) * bias;
    o.type = kind === 'perfect' ? 'sine' : 'triangle'; o.frequency.setValueAtTime(f, t);
    const len = kind === 'perfect' ? .45 : .14;
    g.gain.setValueAtTime(kind === 'perfect' ? .35 : .18, t); g.gain.exponentialRampToValueAtTime(.001, t + len);
    o.connect(g); o.start(t); o.stop(t + len);
    if (kind === 'perfect') { const o2 = a.createOscillator(), g2 = a.createGain(); o2.frequency.value = f * 3;
      g2.gain.setValueAtTime(.08, t); g2.gain.exponentialRampToValueAtTime(.001, t + .2); o2.connect(g2).connect(a.destination); o2.start(t); o2.stop(t + .2); }
    else if (kind === 'ok') hihat(a, t, .06 + feverTier * .02);
  }
  function tick() {
    if (!sound) return;
    const a = audio(), t = a.currentTime, tier = feverTier;
    if (tier === 0) {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(880, t);
      g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.001, t + .04);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + .04);
      return;
    }
    playKick(a, t, tier === 1 ? .18 : tier === 2 ? .26 : .34);
    if (tier >= 2) hihat(a, t + .02, tier === 2 ? .05 : .09);
    if (tier >= 3) hihat(a, t + .08, .07);
  }
  function chordStab(tier) {
    if (!sound) return;
    const a = audio(), t = a.currentTime, base = 220 * Math.pow(1.2, tier);
    [1, 5 / 4, 3 / 2].forEach((r, i) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine'; o.frequency.value = base * r;
      g.gain.setValueAtTime(.12 - i * .02, t); g.gain.exponentialRampToValueAtTime(.001, t + .35);
      o.connect(g).connect(a.destination); o.start(t); o.stop(t + .35);
    });
  }
  function coolCue() {
    if (!sound) return;
    const a = audio(), t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(90, t + .2);
    g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .22);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + .22);
  }

  // ---------- state ----------
  const motionMq = matchMedia('(prefers-reduced-motion: reduce)');

    if (sound) audio(); $('name').blur(); $('start').hidden = true; $('over').hidden = true; reset(); running = true;
    tok = null; rng = rnd; taps = []; beat0 = beatIdx;
    teaching = !taught; $('coach').hidden = !teaching;
    if (!teaching) post('/start', {}).then(j => { tok = j.tok || null; if (Number.isInteger(j.seed)) rng = mulberry32(j.seed); }).catch(() => {});
  }
  $('go').addEventListener('click', () => begin());
  $('again').addEventListener('click', () => begin());
  cv.addEventListener('pointerdown', e => { e.preventDefault(); if (e.isTrusted) tap(); });
  addEventListener('keydown', e => {
    if (!e.isTrusted) return;
    if (e.code === 'Escape') { paused ? resume() : pause(); return; }
    if (e.code !== 'Space' || e.target.tagName === 'INPUT') return; e.preventDefault();
    if (!$('start').hidden) begin();
    else if (!$('over').hidden) begin();
    else if (!paused) tap();
  });
  if (location.protocol.startsWith('http') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  window.onBack = () => {
    if (!$('options').hidden) { $('optDone').click(); return true; }
    if (!$('lb').hidden) { $('lbDone').click(); return true; }
    if (paused) { resume(); return true; }
    if (running && alive) { pause(); return true; } return false; };
})();
</script>
